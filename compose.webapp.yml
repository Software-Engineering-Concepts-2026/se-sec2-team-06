services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: ./services/api/.env.example
        required: true
      - path: ./services/api/.env
        required: false
    ports:
      - "8000:8000"
    environment:
      SYNAPSESYNC_DATA_DIR: /data
    volumes:
      - ./.local:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  webapp:
    build: ./WebApp
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
