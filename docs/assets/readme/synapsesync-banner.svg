<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title description">
  <title id="title">SynapseSync animated banner</title>
  <desc id="description">Animated indigo and violet banner with an open-book neural-network logo, the SynapseSync name, and team information.</desc>

  <defs>
    <linearGradient id="background" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11183f">
        <animate attributeName="stop-color" values="#11183f;#24104f;#11183f" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="52%" stop-color="#541b78">
        <animate attributeName="stop-color" values="#541b78;#66218f;#541b78" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#112b5c">
        <animate attributeName="stop-color" values="#112b5c;#123e70;#112b5c" dur="14s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="halo" cx="50%" cy="35%" r="68%">
      <stop offset="0%" stop-color="#c238d8" stop-opacity=".92"/>
      <stop offset="55%" stop-color="#7c2fc0" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#30135d" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .network-line {
        stroke-dasharray: 8 10;
        animation: dash 8s linear infinite;
      }
      .pulse-a { animation: pulse 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .pulse-b { animation: pulse 2.8s ease-in-out 1.1s infinite; transform-box: fill-box; transform-origin: center; }
      .orbit { animation: orbit 18s linear infinite; transform-origin: 600px 82px; }
      .title-glow { animation: titleGlow 4s ease-in-out infinite; }
      .scan { animation: scan 5s ease-in-out infinite; }
      .float { animation: float 5s ease-in-out infinite; }
      @keyframes dash { to { stroke-dashoffset: -180; } }
      @keyframes pulse {
        0%, 100% { opacity: .55; transform: scale(.8); }
        50% { opacity: 1; transform: scale(1.18); }
      }
      @keyframes orbit { to { transform: rotate(360deg); } }
      @keyframes titleGlow {
        0%, 100% { opacity: .88; }
        50% { opacity: 1; }
      }
      @keyframes scan {
        0%, 100% { transform: translateX(-170px); opacity: 0; }
        20%, 80% { opacity: .85; }
        50% { transform: translateX(170px); opacity: 1; }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .network-line, .pulse-a, .pulse-b, .orbit, .title-glow, .scan, .float {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <rect width="1200" height="340" rx="22" fill="url(#background)"/>
  <circle cx="600" cy="78" r="330" fill="url(#halo)"/>

  <g opacity=".24">
    <path class="network-line" d="M75 86 C220 22 325 125 465 61 S748 10 891 77 S1082 119 1168 48" fill="none" stroke="#67e8f9" stroke-width="2"/>
    <path class="network-line" d="M24 260 C171 195 291 292 420 232 S712 178 842 245 S1064 275 1182 215" fill="none" stroke="#c084fc" stroke-width="2"/>
  </g>

  <g class="orbit" opacity=".8">
    <circle cx="600" cy="22" r="5" fill="#67e8f9" filter="url(#glow)"/>
    <circle cx="657" cy="82" r="4" fill="#c084fc" filter="url(#glow)"/>
    <circle cx="544" cy="83" r="4" fill="#60a5fa" filter="url(#glow)"/>
  </g>

  <g class="float">
    <circle cx="600" cy="82" r="53" fill="#0b1028" stroke="#e9d5ff" stroke-width="3"/>
    <circle cx="600" cy="82" r="45" fill="#151b43" stroke="#67e8f9" stroke-opacity=".35"/>

    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M567 82 Q582 73 598 84 L598 108 Q582 96 567 101 Z" fill="#22d3ee" stroke="#a5f3fc" stroke-width="2"/>
      <path d="M633 82 Q618 73 602 84 L602 108 Q618 96 633 101 Z" fill="#8b5cf6" stroke="#ddd6fe" stroke-width="2"/>
      <path d="M600 84 V109" stroke="#f8fafc" stroke-width="2"/>
      <path d="M576 67 L588 78 M624 67 L612 78 M588 55 L600 72 M612 55 L600 72" stroke="#f8fafc" stroke-width="2"/>
    </g>

    <circle class="pulse-a" cx="576" cy="67" r="5" fill="#22d3ee"/>
    <circle class="pulse-b" cx="624" cy="67" r="5" fill="#a855f7"/>
    <circle class="pulse-b" cx="588" cy="55" r="4" fill="#60a5fa"/>
    <circle class="pulse-a" cx="612" cy="55" r="4" fill="#c084fc"/>
    <circle cx="600" cy="72" r="5" fill="#f8fafc"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" fill="#f8fafc">
    <text class="title-glow" x="600" y="184" text-anchor="middle" font-size="55" font-weight="700" letter-spacing="6" filter="url(#glow)">SYNAPSESYNC</text>
    <text x="600" y="216" text-anchor="middle" font-size="14" font-weight="600" letter-spacing="6" fill="#ddd6fe">LEARN • PRACTICE • PROGRESS</text>
  </g>

  <rect x="430" y="239" width="340" height="3" rx="2" fill="#312e81"/>
  <rect class="scan" x="566" y="239" width="68" height="3" rx="2" fill="url(#accent)" filter="url(#glow)"/>

  <g font-family="Segoe UI, Arial, sans-serif" fill="#e0f2fe">
    <g transform="translate(115 198)">
      <circle cx="0" cy="0" r="12" fill="none" stroke="#67e8f9" stroke-width="2"/>
      <path d="M-5 0 H5 M0 -5 V5" stroke="#67e8f9" stroke-width="2" stroke-linecap="round"/>
      <text x="24" y="5" font-size="14" font-weight="600" letter-spacing="1.5">SE CONCEPTS 2026</text>
      <path d="M0 37 H34 L52 55 H18 Z M43 37 H77 L95 55 H61 Z M86 37 H120 L138 55 H104 Z" fill="none" stroke="#c4b5fd" stroke-width="1.5"/>
    </g>

    <g transform="translate(925 198)">
      <circle cx="0" cy="0" r="12" fill="none" stroke="#c084fc" stroke-width="2"/>
      <path d="M-5 -2 L0 3 L6 -5" fill="none" stroke="#c084fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="5" font-size="14" font-weight="600" letter-spacing="1.5">BRAINLINK CO.</text>
      <path d="M4 37 H38 L56 55 H22 Z M47 37 H81 L99 55 H65 Z M90 37 H124 L142 55 H108 Z" fill="none" stroke="#c4b5fd" stroke-width="1.5"/>
    </g>
  </g>

  <g opacity=".68">
    <circle class="pulse-a" cx="87" cy="61" r="4" fill="#67e8f9"/>
    <circle class="pulse-b" cx="174" cy="114" r="3" fill="#c084fc"/>
    <circle class="pulse-a" cx="1078" cy="76" r="4" fill="#a855f7"/>
    <circle class="pulse-b" cx="1125" cy="253" r="3" fill="#67e8f9"/>
    <circle class="pulse-a" cx="305" cy="286" r="3" fill="#60a5fa"/>
    <circle class="pulse-b" cx="842" cy="292" r="4" fill="#c084fc"/>
  </g>

  <rect x="1.5" y="1.5" width="1197" height="337" rx="21" fill="none" stroke="#a78bfa" stroke-opacity=".28" stroke-width="3"/>
</svg>
