name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # หรือ master ขึ้นอยู่กับว่าคุณใช้ branch ไหนเป็นหลัก

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'prototypes/sprint1'  # ระบุโฟลเดอร์ที่มีไฟล์ index.html ของคุณ

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4